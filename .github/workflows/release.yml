---
name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Quality gate: run lints and tests before building release artifacts ──
  quality-gate:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: TypeScript check
        run: |
          npm ci
          npx tsc --noEmit
        working-directory: ui

  # ── Generate changelog from conventional commits ──────────────────────
  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.generation.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: generation
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md

      - name: Upload changelog artifact
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: CHANGELOG.md

  # ── Build release bundles on all platforms ─────────────────────────────
  build:
    name: Build ${{ matrix.platform }}
    needs: [quality-gate, changelog]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macos
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Download generated changelog
        uses: actions/download-artifact@v4
        with:
          name: changelog

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install system deps (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpcap-dev webkit2gtk-4.1 libxdo-dev libssl-dev \
            librsvg2-dev libappindicator3-dev

      - name: Install Npcap SDK (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          curl.exe -L -o npcap-sdk.zip "https://npcap.com/dist/npcap-sdk-1.13.zip"
          Expand-Archive -Path npcap-sdk.zip -DestinationPath "C:\Program Files\Npcap SDK"
          echo "NPCAP_SDK_PATH=C:\Program Files\Npcap SDK" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ui

      - name: Build release bundle
        uses: tauri-apps/tauri-action@v2
        id: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "FlowNet ${{ github.ref_name }}"
          releaseBody: "${{ needs.changelog.outputs.changelog }}"
          releaseDraft: true
          prerelease: false
