---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-rust:
    name: Lint Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install system deps (pcap)
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - name: Check fmt
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

  build-rust:
    name: Build Rust
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev webkit2gtk-4.1 libxdo-dev libssl-dev librsvg2-dev
      - name: Install deps (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install pcap
      - name: Install Npcap SDK (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          curl.exe -L -o npcap-sdk.zip "https://npcap.com/dist/npcap-sdk-1.13.zip"
          Expand-Archive -Path npcap-sdk.zip -DestinationPath "C:\Program Files\Npcap SDK"
          echo "NPCAP_SDK_PATH=C:\Program Files\Npcap SDK" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build core
        run: cargo build --package flownet-core --release

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build
